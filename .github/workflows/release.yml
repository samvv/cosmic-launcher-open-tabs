# Build the Debian packages and attach them to a GitHub release when a version
# tag like v0.1.0 is pushed. Built on the oldest supported Ubuntu so the
# binaries also run on newer releases.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  deb:
    strategy:
      matrix:
        runner: [ubuntu-22.04, ubuntu-22.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' plugin/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin/Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb
        run: deb/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.runner }}
          path: plugin/target/debian/*.deb
          if-no-files-found: error

  release:
    needs: deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
