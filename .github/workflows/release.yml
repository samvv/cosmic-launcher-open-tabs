# Build the Debian package and attach it to a GitHub release when a version
# tag like v0.1.0 is pushed. Built on the oldest supported Ubuntu so the
# binary also runs on newer releases.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the crate version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' plugin/Cargo.toml | head -1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin/Cargo.toml version $version"
            exit 1
          fi

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build .deb
        run: deb/build.sh

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" plugin/target/debian/*.deb --clobber
