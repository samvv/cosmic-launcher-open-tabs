[package]
name = "browser-tabs"
version = "0.1.0"
edition = "2024"
description = "Search and switch to open browser tabs from COSMIC Launcher"
license = "MPL-2.0"
repository = "https://github.com/samvv/cosmic-launcher-open-tabs"

[dependencies]
base64 = "0.23.1"
futures = "0.3.34"
pop-launcher = "1.2.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "io-std", "io-util", "net", "time", "signal", "fs"] }

# Debian package, built with deb/build.sh (needs `cargo install cargo-deb`).
[package.metadata.deb]
name = "cosmic-launcher-open-tabs"
maintainer = "Sam Vervaeck <samvv-opensource.everglade575@passmail.net>"
copyright = "Sam Vervaeck"
license-file = ["../LICENSE", "0"]
extended-description = """\
A COSMIC Launcher plugin that lets you search your open browser tabs and \
switch to them. Needs the companion extension in a Chromium-based browser."""
depends = "$auto, pop-launcher"
section = "utils"
priority = "optional"
# The native host manifest is generated by deb/build.sh, because it has to
# contain the absolute path of the installed binary.
assets = [
    ["target/release/browser-tabs", "usr/lib/pop-launcher/plugins/browser-tabs/", "755"],
    ["plugin.ron", "usr/lib/pop-launcher/plugins/browser-tabs/", "644"],
    ["target/deb-assets/host.json", "etc/chromium/native-messaging-hosts/be.samvervaeck.cosmic_launcher_open_tabs.json", "644"],
    ["target/deb-assets/host.json", "etc/opt/chrome/native-messaging-hosts/be.samvervaeck.cosmic_launcher_open_tabs.json", "644"],
    ["target/deb-assets/host.json", "etc/opt/edge/native-messaging-hosts/be.samvervaeck.cosmic_launcher_open_tabs.json", "644"],
]
